name: Check changes
description: Checks if there are any changes in the path

inputs:
  path:
    description: Path to check
    required: true
outputs:
  modified:
    description: Is path modified
    value: ${{ steps.modified.outputs.modified }}

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - id: modified
      shell: bash
      run: |
        # Diff base: PR base sha on pull_request, the pre-push sha on push. The old
        # HEAD~$COMMITS was wrong for merge commits — the pushed commits live on the
        # merge's second parent, so they aren't on HEAD's first-parent chain and
        # HEAD~N points past the start of history (`fatal: bad revision`).
        BASE=$(jq -r '.pull_request.base.sha // .before // ""' "${GITHUB_EVENT_PATH}")
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          echo "No diff base (new branch / initial push) — treating path as modified"
          MODIFIED=1
        else
          echo "Diff base: $BASE"
          MODIFIED=$(git diff --name-only "$BASE" HEAD -- ${{ inputs.path }} | wc -l | awk '{print $1}')
          git diff --stat "$BASE" HEAD -- ${{ inputs.path }}
        fi
        echo "Modified files: $MODIFIED"
        echo "modified=$MODIFIED" >> $GITHUB_OUTPUT
